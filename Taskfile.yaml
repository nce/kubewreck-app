version: '3'

vars:
  REGISTRY: ghcr.io/nce
  IMAGE_NAME: kubewreck-app
  LOCAL_PLATFORM: linux/amd64

tasks:
  air:
    desc: Build local binary
    dir: app/
    cmd: 
      air --build.cmd "go build -o bin/app -ldflags='-X main.version=foo'" --build.bin "./bin/app"
  build:
    desc: Build local images
    dir: app/
    cmds:
    - docker buildx build
        --builder naughty_benz
        --target v1
        --build-arg APP_VERSION="v1"
        --platform {{.LOCAL_PLATFORM}}
        --load
        --tag {{.REGISTRY}}/{{.IMAGE_NAME}}:v1 .
    - docker buildx build
        --builder naughty_benz
        --target v2
        --build-arg APP_VERSION="v2"
        --platform {{.LOCAL_PLATFORM}}
        --load
        --tag {{.REGISTRY}}/{{.IMAGE_NAME}}:v2 .
  push:
    desc: Login and push images to GitHub Container Registry
    dir: app/
    cmds:
    - |
      sh -eu <<'PUSH_SCRIPT'
      original_config="${DOCKER_CONFIG:-$HOME/.docker}"
      push_config="$(mktemp -d)"
      trap 'rm -rf "$push_config"' EXIT
      trap 'exit 130' INT
      trap 'exit 143' TERM

      # Preserve the selected daemon, named builders, and user-installed plugins.
      push_context="$(docker context show)"
      export DOCKER_CONTEXT="$push_context"
      export BUILDX_CONFIG="${BUILDX_CONFIG:-$original_config/buildx}"
      for directory in contexts cli-plugins; do
        if [ -d "$original_config/$directory" ]; then
          ln -s "$original_config/$directory" "$push_config/$directory"
        fi
      done
      # File-based auth in a private temporary directory bypasses macOS Keychain.
      github_user="$(gh api user --jq .login)"
      github_token="$(gh auth token)"
      registry_auth="$(printf '%s:%s' "$github_user" "$github_token" | base64 | tr -d '\r\n')"
      printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$registry_auth" > "$push_config/config.json"
      chmod 600 "$push_config/config.json"
      unset github_token registry_auth
      export DOCKER_CONFIG="$push_config"

      for target in v1 v2; do
        docker buildx build \
          --builder naughty_benz \
          --target "$target" \
          --build-arg APP_VERSION="$target" \
          --platform linux/amd64 \
          --push \
          --tag "{{.REGISTRY}}/{{.IMAGE_NAME}}:$target" .
      done
      PUSH_SCRIPT
